<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание ERC-20 Токена на Ethereum</title>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #3498db; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; width: 100%; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 20px; padding: 10px; border-radius: 5px; background-color: #ecf0f1; border: 1px solid #bdc3c7; }
        .wallet-status { text-align: center; margin-bottom: 20px; padding: 10px; border: 1px solid #e74c3c; color: #e74c3c; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Создание ERC-20 Токена</h1>
        
        <div class="wallet-status" id="wallet-status">
            Кошелек не подключен. Нажмите "Подключить кошелек".
        </div>

        <button id="connect-btn">Подключить кошелек (WalletConnect)</button>

        <form id="token-form">
            <hr>
            <h2>Параметры Токена</h2>

            <div class="form-group">
                <label for="name">Название Токена (Name)</label>
                <input type="text" id="name" required value="MyAwesomeCoin">
            </div>

            <div class="form-group">
                <label for="symbol">Символ (Symbol)</label>
                <input type="text" id="symbol" required value="MAC">
            </div>

            <div class="form-group">
                <label for="supply">Общее предложение (Total Supply)</label>
                <input type="number" id="supply" required value="1000000" min="1">
            </div>
            
            <div class="form-group">
                <label for="decimals">Десятичные знаки (Decimals)</label>
                <input type="number" id="decimals" required value="18" min="0" max="18">
            </div>

            <button type="submit" id="deploy-btn" disabled>Деплой Токена на Ethereum</button>
        </form>

        <div id="status">
            Ожидание действий...
        </div>

        <div id="result"></div>
    </div>

    <script src="app.js"></script> </body>
</html>
