<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO CREATOR — Все сети</title>

    <!-- WalletConnect + Ethers.js -->
    <script src="https://unpkg.com/@walletconnect/web3-provider@2.13.0/dist/umd/index.min.js"></script>
    <script src="https://unpkg.com/ethers@6.15.0/dist/ethers.umd.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 3.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .network {
            background: rgba(0,255,0,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin: 15px 0;
            display: inline-block;
        }
        input, select {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 1.1rem;
        }
        input::placeholder { color: rgba(255,255,255,0.7); }

        button {
            width: 100%;
            padding: 18px;
            margin: 18px 0;
            border: none;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s;
        }
        .connect-btn {
            background: linear-gradient(45deg, #ff00aa, #00ffff);
            color: white;
        }
        #createBtn {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            color: black;
        }
        button:hover { transform: translateY(-6px); box-shadow: 0 15px 40px rgba(0,255,255,0.5); }
        button:disabled { background: #444; cursor: not-allowed; transform: none; }

        .result {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            background: rgba(0,255,100,0.2);
            border: 2px solid #00ffaa;
            display: none;
            word-break: break-all;
        }
        .error { background: rgba(255,0,0,0.2); border-color: #ff0066; }

        .loader { display: none; margin: 20px 0; }
        .loader::after {
            content: '';
            display: inline-block;
            width: 40px; height: 40px;
            border: 5px solid #00ffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h1>CRYPTO CREATOR</h1>
    <p>Создай токен в любой EVM-сети за 30 секунд</p>

    <button class="connect-btn" id="connectBtn">Подключить кошелёк (MetaMask / WalletConnect)</button>
    <div id="network" class="network" style="display:none;"></div>
    <div id="account" style="margin:15px 0; font-weight:bold;"></div>

    <input type="text" id="name" placeholder="Название токена" value="MyToken">
    <input type="text" id="symbol" placeholder="Символ (MTK)" value="MTK" maxlength="10">
    <input type="number" id="supply" placeholder="Общий объём (например 1000000)" value="1000000">
    <select id="decimals">
        <option value="18">18 decimals (как ETH)</option>
        <option value="9">9 decimals (как USDT)</option>
        <option value="6">6 decimals (как USDC)</option>
    </select>

    <div class="loader" id="loader"></div>
    <button id="createBtn" disabled>СОЗДАТЬ ТОКЕН В ЭТОЙ СЕТИ</button>

    <div class="result" id="result"></div>
</div>

<script>
// Поддерживаемые сети
const networks = {
    1: { name: "Ethereum Mainnet", explorer: "https://etherscan.io" },
    11155111: { name: "Sepolia Testnet", explorer: "https://sepolia.etherscan.io" },
    137: { name: "Polygon", explorer: "https://polygonscan.com" },
    56: { name: "BNB Chain", explorer: "https://bscscan.com" },
    42161: { name: "Arbitrum One", explorer: "https://arbiscan.io" },
    10: { name: "Optimism", explorer: "https://optimistic.etherscan.io" },
    8453: { name: "Base", explorer: "https://basescan.org" },
    43114: { name: "Avalanche C-Chain", explorer: "https://snowtrace.io" },
    250: { name: "Fantom", explorer: "https://ftmscan.com" },
    100: { name: "Gnosis Chain", explorer: "https://gnosisscan.io" }
};

let provider, signer, userAddress, chainId;

// Универсальное подключение (MetaMask + WalletConnect)
async function connectWallet() {
    const btn = document.getElementById('connectBtn');
    btn.disabled = true;
    btn.textContent = "Подключение...";

    try {
        // Пробуем MetaMask
        if (window.ethereum) {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            provider = new ethers.BrowserProvider(window.ethereum);
        } else {
            // Если нет — WalletConnect
            const wc = new WalletConnectProvider.default({
                rpc: Object.fromEntries(Object.keys(networks).map(id => [id, `https://eth-mainnet.g.alchemy.com/v2/demo`])) // можно заменить
            });
            await wc.enable();
            provider = new ethers.BrowserProvider(wc);
        }

        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        const network = await provider.getNetwork();
        chainId = Number(network.chainId);

        const netName = networks[chainId]?.name || `Сеть ${chainId}`;
        document.getElementById('network').textContent = netName;
        document.getElementById('network').style.display = 'inline-block';
        document.getElementById('account').textContent = `Подключено: \( {userAddress.slice(0,8)}... \){userAddress.slice(-6)}`;
        document.getElementById('createBtn').disabled = false;
        btn.textContent = 'Подключено!';
    } catch (err) {
        alert('Ошибка подключения: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Подключить кошелёк';
    }
}

document.getElementById('connectBtn').addEventListener('click', connectWallet);

// Создание токена

    result.style.display = 'none';
