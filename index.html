<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO CREATOR 2026 — Создай токен в любой сети</title>
    <meta name="description" content="Создай свой токен за 1 минуту в Ethereum, BSC, Polygon, Arbitrum, Solana, TON и 20+ других сетях через Simple-Web3-Php">
    
    <!-- Open Graph -->
    <meta property="og:title" content="CRYPTO CREATOR 2026">
    <meta property="og:description" content="Создай токен в любой сети за 60 секунд">
    <meta property="og:image" content="https://2026createcoin.vercel.app/og-image.jpg">
    <meta property="og:url" content="https://2026createcoin.vercel.app">
    
    <!-- Иконка и стиль -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₿</text></svg>">
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #00f5ff;
            --text: #e0e0e0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(0,245,255,0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(0,245,255,0.1) 0%, transparent 20%);
        }
        header {
            text-align: center;
            margin: 40px 0 50px;
        }
        h1 {
            font-size: 4rem;
            background: linear-gradient(90deg, #00f5ff, #00bfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.4rem;
            opacity: 0.8;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        .network-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .network-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(0,245,255,0.2);
            position: relative;
            overflow: hidden;
        }
        .network-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,245,255,0.2);
            border-color: var(--accent);
        }
        .network-card.selected {
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px rgba(0,245,255,0.4);
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-bottom: 15px;
            border-radius: 12px;
        }
        .name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .chain-id {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 10px;
        }
        .create-btn {
            margin-top: 50px;
            text-align: center;
        }
        .create-btn button {
            background: linear-gradient(45deg, #00f5ff, #0099ff);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,245,255,0.4);
        }
        .create-btn button:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0,245,255,0.6);
        }
        .create-btn button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        footer {
            margin-top: 100px;
            opacity: 0.6;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            .subtitle { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>CRYPTO CREATOR</h1>
        <p class="subtitle">Создай свой токен в любой сети за 60 секунд</p>
    </header>

    <div class="container">
        <div class="network-grid" id="networks">
            <!-- Сети будут вставлены через JS ниже -->
        </div>

        <div class="create-btn">
            <button id="createTokenBtn" disabled>
                Выберите сеть для создания токена
            </button>
        </div>
    </div>

    <footer>
        © 2026 CRYPTO CREATOR — Powered by Simple-Web3-Php
    </footer>

    <script>
        const networks = [
            { name: "Ethereum Mainnet", chainId: 1, rpc: "https://eth.llamarpc.com", explorer: "https://etherscan.io", logo: "https://cryptologos.cc/logos/ethereum-eth-logo.png" },
            { name: "BNB Smart Chain", chainId: 56, rpc: "https://bsc-dataseed.binance.org", explorer: "https://bscscan.com", logo: "https://cryptologos.cc/logos/bnb-bnb-logo.png" },
            { name: "Polygon", chainId: 137, rpc: "https://polygon-rpc.com", explorer: "https://polygonscan.com", logo: "https://cryptologos.cc/logos/polygon-matic-logo.png" },
            { name: "Arbitrum One", chainId: 42161, rpc: "https://arb1.arbitrum.io/rpc", explorer: "https://arbiscan.io", logo: "https://cryptologos.cc/logos/arbitrum-arb-logo.png" },
            { name: "Optimism", chainId: 10, rpc: "https://mainnet.optimism.io", explorer: "https://optimistic.etherscan.io", logo: "https://cryptologos.cc/logos/optimism-ethereum-op-logo.png" },
            { name: "Avalanche C-Chain", chainId: 43114, rpc: "https://api.avax.network/ext/bc/C/rpc", explorer: "https://snowtrace.io", logo: "https://cryptologos.cc/logos/avalanche-avax-logo.png" },
            { name: "Fantom Opera", chainId: 250, rpc: "https://rpc.ftm.tools", explorer: "https://ftmscan.com", logo: "https://cryptologos.cc/logos/fantom-ftm-logo.png" },
            { name: "Cronos", chainId: 25, rpc: "https://evm.cronos.org", explorer: "https://cronoscan.com", logo: "https://cryptologos.cc/logos/cronos-cro-logo.png" },
            { name: "Gnosis Chain", chainId: 100, rpc: "https://rpc.gnosischain.com", explorer: "https://gnosisscan.io", logo: "https://cryptologos.cc/logos/gnosis-gno-logo.png" },
            { name: "Base", chainId: 8453, rpc: "https://mainnet.base.org", explorer: "https://basescan.org", logo: "https://cryptologos.cc/logos/base-base-logo.png" },
            { name: "zkSync Era", chainId: 324, rpc: "https://mainnet.era.zksync.io", explorer: "https://explorer.zksync.io", logo: "https://zksync.io/favicon.ico" },
            { name: "Solana", chainId: "solana", rpc: "https://api.mainnet-beta.solana.com", explorer: "https://solscan.io", logo: "https://cryptologos.cc/logos/solana-sol-logo.png" },
            { name: "TON", chainId: "ton", rpc: "https://toncenter.com/api/v2/jsonRPC", explorer: "https://tonscan.org", logo: "https://ton.org/logo.png" },
            { name: "Tron", chainId: "tron", rpc: "https://api.trongrid.io", explorer: "https://tronscan.org", logo: "https://cryptologos.cc/logos/tron-trx-logo.png" },
            // Добавьте ещё сетей при желании
        ];

        const grid = document.getElementById('networks');
        const btn = document.getElementById('createTokenBtn');
        let selectedNetwork = null;

        networks.forEach(net => {
            const card = document.createElement('div');
            card.className = 'network-card';
            card.innerHTML = `
                <img src="\( {net.logo}" alt=" \){net.name}" class="logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=50 cy=50 r=40 fill=%22%2300f5ff%22/><text x=50 y=58 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22>?</text></svg>'">
                <div class="name">${net.name}</div>
                <div class="chain-id">Chain ID: ${net.chainId === 'solana' || net.chainId === 'ton' || net.chainId === 'tron' ? '—' : net.chainId}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.network-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedNetwork = net;
                btn.disabled = false;
                btn.textContent = `Создать токен в ${net.name} →`;
            };
            grid.appendChild(card);
        });

        btn.onclick = () => {
            if (selectedNetwork) {
                // Замените на ваш PHP-скрипт или форму
                const url = `https://2026createcoin.vercel.app/create.php?network=\( {encodeURIComponent(selectedNetwork.name)}&chainId= \){selectedNetwork.chainId}`;
                window.location.href = url;
            }
        };
    </script>
</body>
</html>
