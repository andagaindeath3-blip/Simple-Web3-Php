<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Token Creator — Создай токен за минуту</title>

  <!-- Web3Modal (новая версия, работает без Project ID) -->
  <script type="module">
    import { createWeb3Modal, defaultConfig } from 'https://unpkg.com/@web3modal/walletconnect@latest/dist/index.js';
    
    const projectId = ''; // Можно оставить пустым — всё равно работает!
    const metadata = {
      name: 'Token Creator',
      description: 'Создание ERC-20 токена',
      url: window.location.origin,
      icons: ['https://avatars.githubusercontent.com/u/37784886']
    };

    const chains = [
      { chainId: 1, name: 'Ethereum', currency: 'ETH', explorerUrl: 'https://etherscan.io' },
      { chainId: 137, name: 'Polygon', currency: 'MATIC', explorerUrl: 'https://polygonscan.com' },
      { chainId: 56, name: 'BSC', currency: 'BNB', explorerUrl: 'https://bscscan.com' },
      { chainId: 43114, name: 'Avalanche', currency: 'AVAX', explorerUrl: 'https://snowtrace.io' },
      { chainId: 42161, name: 'Arbitrum', currency: 'ETH', explorerUrl: 'https://arbiscan.io' },
      { chainId: 10, name: 'Optimism', currency: 'ETH', explorerUrl: 'https://optimistic.etherscan.io' },
      { chainId: 8453, name: 'Base', currency: 'ETH', explorerUrl: 'https://basescan.org' },
    ];

    window.w3m = createWeb3Modal({
      projectId,
      metadata,
      chains,
      themeMode: 'dark',
      themeVariables: {
        '--w3m-accent-color': '#00ff9d',
        '--w3m-background-color': '#1a1a2e'
      },
      enableWalletConnect: true,
      enableInjected: true,  // MetaMask, Trust, Rabby и т.д.
      enableEmail: false
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>

  <style>
    :root { --accent: #00ff9d; --bg: #0f0f1a; --card: rgba(30,30,50,0.95); }
    body {
      margin:0; padding:20px; font-family: 'Segoe UI', sans-serif;
      background: var(--bg); color: white;
      min-height: 100vh;
      background-image: radial-gradient(circle at 10% 20%, rgba(0,255,150,0.3) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgba(0,200,255,0.3) 0%, transparent 20%);
      display: flex; align-items: center; justify-content: center;
    }
    .container {
      width: 90%; max-width: 500px; background: var(--card);
      border-radius: 20px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      border: 1px solid rgba(0,255,157,0.3); backdrop-filter: blur(12px);
    }
    h1 { text-align:center; font-size:2.4rem; margin-bottom:8px;
      background: linear-gradient(90deg, #00ff9d, #00d0ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align:center; color:#aaa; margin-bottom:30px; }
    label { display:block; margin:20px 0 8px; font-weight:600; }
    input, select {
      width:100%; padding:14px; border-radius:12px; border:1px solid rgba(0,255,157,0.3);
      background:rgba(255,255,255,0.05); color:white; font-size:1rem;
    }
    .btn {
      width:100%; padding:16px; margin-top:25px; background:var(--accent);
      color:black; font-weight:bold; font-size:1.1rem; border:none;
      border-radius:12px; cursor:pointer; transition:0.3s;
    }
    .btn:hover { background:#00cc7a; }
    .btn:disabled { background:#555; cursor:not-allowed; }
    #status {
      margin-top:20px; padding:16px; border-radius:12px;
      background:rgba(0,0,0,0.4); text-align:center; min-height:50px;
    }
    .hidden { display:none; }
  </style>
</head>
<body>

<div class="container">
  <h1>Token Creator</h1>
  <p class="subtitle">Создай свой токен в любой сети</p>

  <div id="connectSection">
    <button id="connectBtn" class="btn">Подключить кошелёк</button>
  </div>

  <div id="formSection" class="hidden">
    <label>Сеть</label>
    <select id="network">
      <option value="ethereum">Ethereum</option>
      <option value="polygon" selected>Polygon</option>
      <option value="bsc">BSC</option>
      <option value="avalanche">Avalanche</option>
      <option value="arbitrum">Arbitrum</option>
      <option value="optimism">Optimism</option>
      <option value="base">Base</option>
    </select>

    <label>Название токена</label>
    <input type="text" id="name" placeholder="My Awesome Token" />

    <label>Символ</label>
    <input type="text" id="symbol" placeholder="MAT" maxlength="10" />

    <label>Decimals</label>
    <input type="number" id="decimals" value="18" min="0" max="18" />

    <label>Supply</label>
    <input type="number" id="supply" placeholder="1000000" />

    <button id="createBtn" class="btn">Создать токен</button>
  </div>

  <div id="status">Нажмите кнопку выше</div>
</div>

<script>
  let provider = null;
  let signer = null;
  let userAddress = "";

  // Кнопка подключения
  document.getElementById("connectBtn").onclick = async () => {
    try {
      // Открываем модальное окно (или подключаемся через MetaMask автоматически)
      provider = await window.w3m.connect();

      const ethersProvider = new ethers.BrowserProvider(provider);
      signer = await ethersProvider.getSigner();
      userAddress = await signer.getAddress();

      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("formSection").classList.remove("hidden");
      document.getElementById("status").innerHTML = `
        Подключён: <b>\( {userAddress.slice(0,6)}... \){userAddress.slice(-4)}</b>
      `;
    } catch (err) {
      document.getElementById("status").innerHTML = "Подключение отклонено";
      console.error(err);
    }
  };

  // Создание токена
  document.getElementById("createBtn").onclick = async () => {
    const data = {
      network: document.getElementById("network").value,
      name: document.getElementById("name").value.trim(),
      symbol: document.getElementById("symbol").value.trim().toUpperCase(),
      decimals: parseInt(document.getElementById("decimals").value),
      supply: document.getElementById("supply").value,
      owner: userAddress
    };

    if (!data.name || !data.symbol || !data.supply) {
      alert("Заполните все поля!");
      return;
    }

    document.getElementById("status").innerHTML = "Создаём токен...";
    document.getElementById("createBtn").disabled = true;

    try {
      const res = await fetch("create_token.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const json = await res.json();

      if (json.success) {
        document.getElementById("status").innerHTML = `
          <div style="color:#00ff9d">
            Токен создан!<br><br>
            <b>\( {data.name} ( \){data.symbol})</b><br><br>
            <a href="https://polygonscan.com/address/${json.contractAddress}" target="_blank" style="color:#00d0ff">
              Посмотреть контракт
            </a>
          </div>
        `;
      } else {
        document.getElementById("status").innerHTML = "Ошибка: " + (json.error || "неизвестно");
      }
    } catch (e) {
      document.getElementById("status").innerHTML = "Ошибка сервера";
    }

    document.getElementById("createBtn").disabled = false;
  };
</script>

</body>
</html>
