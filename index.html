<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO CREATOR — Simple-Web3-Php</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@4.3.0/dist/web3.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .network {
            background: rgba(0,255,100,0.3);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            margin: 15px 0;
            display: inline-block;
        }
        input, select {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1.1rem;
        }
        input::placeholder { color: rgba(255,255,255,0.7); }

        button {
            width: 100%;
            padding: 18px;
            margin: 20px 0;
            border: none;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s;
        }
        #connectBtn {
            background: linear-gradient(45deg, #ff00aa, #00ffff);
            color: white;
        }
        #createBtn {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            color: black;
        }
        button:hover { transform: translateY(-6px); box-shadow: 0 15px 40px rgba(0,255,255,0.5); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }

        .result {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            background: rgba(0,255,100,0.2);
            border: 2px solid #00ffaa;
            display: none;
            word-break: break-all;
        }
        .error { background: rgba(255,0,0,0.2); border-color: #ff0066; }

        .loader { display: none; margin: 20px 0; }
        .loader::after {
            content: '';
            display: inline-block;
            width: 40px; height: 40px;
            border: 5px solid #00ffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h1>CRYPTO CREATOR</h1>
    <p>Создай токен в любой сети через Simple-Web3-Php</p>

    <button id="connectBtn">Подключить кошелёк</button>
    <div id="network" class="network" style="display:none;"></div>
    <div id="account" style="margin:15px 0; font-weight:bold;"></div>

    <input type="text" id="name" placeholder="Название токена" value="MyToken">
    <input type="text" id="symbol" placeholder="Символ (MTK)" value="MTK" maxlength="10">
    <input type="number" id="supply" placeholder="Общий объём" value="1000000">
    <select id="decimals">
        <option value="18">18 decimals</option>
        <option value="9">9 decimals</option>
        <option value="6">6 decimals</option>
    </select>

    <div class="loader" id="loader"></div>
    <button id="createBtn" disabled>СОЗДАТЬ ТОКЕН</button>

    <div class="result" id="result"></div>
</div>

<script>
let web3, userAccount, chainId;

const networks = {
    1: "Ethereum Mainnet", 11155111: "Sepolia", 137: "Polygon", 56: "BNB Chain",
    42161: "Arbitrum", 10: "Optimism", 8453: "Base", 43114: "Avalanche"
};

document.getElementById('connectBtn').onclick = async () => {
    if (!window.ethereum) return alert('Установи MetaMask или другой Web3-кошелёк!');

    try {
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        web3 = new Web3(window.ethereum);
        const accounts = await web3.eth.getAccounts();
        userAccount = accounts[0];
        chainId = await web3.eth.getChainId();

        document.getElementById('account').textContent = `Подключено: \( {userAccount.slice(0,8)}... \){userAccount.slice(-6)}`;
        document.getElementById('network').textContent = networks[chainId] || `Сеть ${chainId}`;
        document.getElementById('network').style.display = 'inline-block';
        document.getElementById('connectBtn').textContent = 'Подключено';
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('createBtn').disabled = false;
    } catch (err) {
        alert('Ошибка подключения: ' + err.message);
    }
};

document.getEventListener('createBtn').onclick = async () => {
    if (!userAccount) return alert('Сначала подключи кошелёк!');

    const name = document.getElementById('name').value.trim();
    const symbol = document.getElementById('symbol').value.trim().toUpperCase();
    const supply = document.getElementById('supply').value;
    const decimals = document.getElementById('decimals').value;

    if (!name || !symbol || !supply) return alert('Заполни все поля!');

    const btn = document.getElementById('createBtn');
    const loader = document.getElementById('loader');
    const result = document.getElementById('result');
    btn.disabled = true;
    loader.style.display = 'block';
    result.style.display = 'none';

    try {
        const response = await fetch('deploy.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name, symbol, supply, decimals,
                from: userAccount,
                chainId: chainId
            })
        });

        const data = await response.json();

        loader.style.display = 'none';

        if (data.success) {
            result.className = 'result';
            result.innerHTML = `
                <h3>ТОКЕН СОЗДАН!</h3>
                <strong>\( {name} ( \){symbol})</strong><br><br>
                Адрес: <a href="\( {data.explorer}/address/ \){data.contract}" target="_blank">${data.contract}</a><br><br>
                Tx: <a href="\( {data.explorer}/tx/ \){data.tx}" target="_blank">${data.tx.slice(0,20)}...</a>
            `;
        } else {
            result.className = 'result error';
            result.innerHTML = `<h3>Ошибка</h3>${data.error}`;
        }
        result.style.display = 'block';
    } catch (err) {
        loader.style.display = 'none';
        result.className = 'result error';
        result.innerHTML = `<h3>Ошибка сети</h3>${err.message}`;
        result.style.display = 'block';
    }

    btn.disabled = false;
};
</script>
</body>
</html>
