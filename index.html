<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Создать токен в любой сети</title>
  <script src="https://cdn.jsdelivr.net/npm/web3modal@1.9.12/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body {font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background:#f9f9f9;}
    h1 {text-align:center;}
    button, select, input {padding:10px; font-size:16px; margin:5px 0;}
    #form {display:none; background:white; padding:20px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
    #status {margin-top:15px; padding:15px; background:#e9ecef; border-radius:5px;}
  </style>
</head>
<body>
  <h1>Создать свой токен в любой EVM-сети</h1>
  <button id="connectBtn">Подключить кошелёк (WalletConnect)</button>
  <div id="status"></div>

  <div id="form">
    <label>Сеть:</label>
    <select id="network">
      <option value="ethereum">Ethereum Mainnet</option>
      <option value="polygon">Polygon</option>
      <option value="bsc">Binance Smart Chain (BSC)</option>
      <option value="avalanche">Avalanche C-Chain</option>
      <option value="arbitrum">Arbitrum One</option>
      <option value="optimism">Optimism</option>
      <option value="fantom">Fantom Opera</option>
      <option value="gnosis">Gnosis Chain (xDai)</option>
      <option value="cronos">Cronos</option>
      <option value="moonbeam">Moonbeam</option>
      <option value="moonriver">Moonriver</option>
      <option value="aurora">Aurora</option>
      <option value="celo">Celo</option>
      <option value="base">Base</option>
      <option value="zksync">zkSync Era</option>
      <option value="linea">Linea</option>
      <option value="scroll">Scroll</option>
      <option value="mantle">Mantle</option>
    </select><br><br>

    <label>Название токена:</label><input type="text" id="name" placeholder="My Token" required /><br><br>
    <label>Символ:</label><input type="text" id="symbol" placeholder="MTK" maxlength="10" required /><br><br>
    <label>Decimals:</label><input type="number" id="decimals" value="18" min="0" max="18" /><br><br>
    <label>Общий supply:</label><input type="number" id="supply" placeholder="1000000" required /><br><br>

    <button onclick="createToken()">Создать токен</button>
  </div>

<script>
// ===== RPC и chainId для всех сетей =====
const networks = {
  ethereum:   { chainId: 1,   rpc: "https://eth-mainnet.public.blastapi.io" },
  polygon:    { chainId: 137, rpc: "https://polygon-rpc.com" },
  bsc:        { chainId: 56,  rpc: "https://bsc-dataseed.binance.org" },
  avalanche:  { chainId: 43114, rpc: "https://api.avax.network/ext/bc/C/rpc" },
  arbitrum:   { chainId: 42161, rpc: "https://arb1.arbitrum.io/rpc" },
  optimism:   { chainId: 10,   rpc: "https://mainnet.optimism.io" },
  fantom:     { chainId: 250,  rpc: "https://rpc.ftm.tools" },
  gnosis:     { chainId: 100,  rpc: "https://rpc.gnosis.gateway.fm" },
  cronos:     { chainId: 25,   rpc: "https://evm.cronos.org" },
  moonbeam:   { chainId: 1284, rpc: "https://rpc.api.moonbeam.network" },
  moonriver:  { chainId: 1285, rpc: "https://rpc.api.moonriver.network" },
  aurora:     { chainId: 1313161554, rpc: "https://mainnet.aurora.dev" },
  celo:       { chainId: 42220, rpc: "https://forno.celo.org" },
  base:       { chainId: 8453, rpc: "https://mainnet.base.org" },
  zksync:     { chainId: 324,  rpc: "https://mainnet.era.zksync.io" },
  linea:      { chainId: 59144, rpc: "https://rpc.linea.build" },
  scroll:     { chainId: 534352, rpc: "https://rpc.scroll.io" },
  mantle:     { chainId: 5000, rpc: "https://rpc.mantle.xyz" }
};

let userAddress = "";

const providerOptions = {
  walletconnect: {
    package: WalletConnectProvider,
    options: { rpc: Object.fromEntries(Object.entries(networks).map(([k,v])=>[v.chainId, v.rpc])) }
  }
};

const web3Modal = new Web3Modal({ cacheProvider: false, providerOptions });

async function connectWallet() {
  try {
    const instance = await web3Modal.connect();
    const provider = new ethers.providers.Web3Provider(instance);
    const signer = provider.getSigner();
    userAddress = await signer.getAddress();
    document.getElementById("status").innerHTML = `<b>Подключён:</b> ${userAddress}`;
    document.getElementById("form").style.display = "block";
    document.getElementById("connectBtn").style.display = "none";
  } catch(e) {
    document.getElementById("status").innerHTML = "Ошибка подключения";
    console.error(e);
  }
}

async function createToken() {
  const net = document.getElementById("network").value;
  const data = {
    network: net,
    chainId: networks[net].chainId,
    name: document.getElementById("name").value,
    symbol: document.getElementById("symbol").value,
    decimals: parseInt(document.getElementById("decimals").value),
    supply: document.getElementById("supply").value,
    owner: userAddress
  };

  document.getElementById("status").innerHTML = "Отправка запроса на сервер...";

  try {
    const r = await fetch("create_token.php", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
    const res = await r.json();
    if(res.success){
      document.getElementById("status").innerHTML = `
        <b>Токен успешно создан!</b><br>
        Сеть: ${net}<br>
        Адрес контракта: <a href="\( {getExplorer(net)}/address/ \){res.contract}" target="_blank">${res.contract}</a><br>
        Tx: <a href="\( {getExplorer(net)}/tx/ \){res.tx}" target="_blank">${res.tx}</a>
      `;
    } else {
      document.getElementById("status").innerHTML = "<b>Ошибка:</b> " + res.error;
    }
  } catch(e){
    document.getElementById("status").innerHTML = "Ошибка связи с сервером";
    console.error(e);
  }
}

function getExplorer(net){
  const explorers = {
    ethereum: "https://etherscan.io", polygon: "https://polygonscan.com", bsc: "https://bscscan.com",
    avalanche: "https://snowtrace.io", arbitrum: "https://arbiscan.io", optimism: "https://optimistic.etherscan.io",
    fantom: "https://ftmscan.com", gnosis: "https://gnosisscan.io", cronos: "https://cronoscan.com",
    moonbeam: "https://moonscan.io", moonriver: "https://moonriver.moonscan.io", aurora: "https://aurorascan.dev",
    celo: "https://celoscan.io", base: "https://basescan.org", zksync: "https://explorer.zksync.io",
    linea: "https://lineascan.build", scroll: "https://scrollscan.com", mantle: "https://mantlescan.xyz"
  };
  return explorers[net] || "https://etherscan.io";
}
</script>
</body>
</html>
