<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO CREATOR 2026 — Создай токен с Simple-Web3-Php</title>
    <meta name="description" content="Деплой ERC-20 токена в любой EVM-сети через PHP. Интеграция с Simple-Web3-Php.">
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; text-align: center; }
        form { max-width: 500px; margin: 0 auto; background: #1a1a1a; padding: 30px; border-radius: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; }
        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #00ff88; color: #000; }
        .error { background: #ff4444; }
    </style>
</head>
<body>
    <h1>CRYPTO CREATOR</h1>
    <p>Создай ERC-20 токен в любой сети через Simple-Web3-Php</p>

    <form id="tokenForm">
        <select id="network" required>
            <option value="ethereum">Ethereum Mainnet</option>
            <option value="bsc">BNB Smart Chain</option>
            <option value="polygon">Polygon</option>
            <option value="arbitrum">Arbitrum</option>
            <!-- Добавьте больше -->
        </select>
        
        <input type="number" id="supply" placeholder="Initial Supply (e.g., 1000000)" required min="1">
        
        <input type="text" id="address" placeholder="Your Wallet Address (0x...)" required>
        
        <input type="password" id="privateKey" placeholder="Private Key (0x... — ТЕСТ!)" required>
        
        <button type="submit">Создать токен</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                network: document.getElementById('network').value,
                supply: document.getElementById('supply').value,
                address: document.getElementById('address').value,
                privateKey: document.getElementById('privateKey').value
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Создаём токен...';
            resultDiv.className = '';
            
            try {
                const res = await fetch('/api/create.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3>✅ Успех!</h3>
                        <p>Tx Hash: <a href="\( {data.explorer}" target="_blank"> \){data.txHash}</a></p>
                        <p>Contract Address: ${data.contractAddress}</p>
                    `;
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = `<h3>❌ Ошибка: ${data.error}</h3>`;
                    resultDiv.className = 'error';
                }
            } catch (err) {
                resultDiv.innerHTML = `<h3>❌ Network Error: ${err.message}</h3>`;
                resultDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
