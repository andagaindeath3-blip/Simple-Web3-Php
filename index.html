<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать свой токен за 30 секунд</title>
    <script src="https://cdn.ethers.gg/v6/ethers.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { opacity: 0.9; margin-bottom: 30px; }
        input, select, button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
        }
        input, select { background: rgba(255,255,255,0.2); color: white; }
        input::placeholder { color: rgba(255,255,255,0.7); }
        button {
            background: #00d4ff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00b0d4; transform: scale(1.02); }
        button:disabled { background: #555; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            min-height: 50px;
            word-break: break-all;
        }
        .success { background: rgba(0,255,0,0.3)!important; }
        .error { background: rgba(255,0,0,0.4)!important; }
        a { color: #a0f7ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Создай свой токен за 30 секунд</h1>
        <p>Подключи MetaMask → заполни → получи свой токен ERC-20</p>

        <button id="connectBtn">Подключить MetaMask</button>
        <div id="account"></div>

        <div id="form" style="display:none; margin-top:20px;">
            <input type="text" id="name" placeholder="Название токена (MyCoin)" required>
            <input type="text" id="symbol" placeholder="Символ (MYC)" maxlength="11" required>
            <input type="number" id="supply" placeholder="Общий выпуск (например: 1000000)" required>
            <button id="createBtn">Создать токен!</button>
        </div>

        <div class="status" id="status">Готов к запуску...</div>
    </div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const createBtn = document.getElementById('createBtn');
    const status = document.getElementById('status');
    const accountDiv = document.getElementById('account');
    const form = document.getElementById('form');

    let signer, userAddress;

    // Подключение кошелька
    connectBtn.onclick = async () => {
        if (!window.ethereum) {
            alert("Установите MetaMask!");
            return;
        }

        try {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();

            accountDiv.innerHTML = `Подключено: <b>\( {userAddress.substr(0,8)}... \){userAddress.substr(-6)}</b>`;
            connectBtn.style.display = 'none';
            form.style.display = 'block';
            status.textContent = "Кошелёк подключён! Заполните данные токена.";
            status.classList.remove('error', 'success');
        } catch (e) {
            status.textContent = "Ошибка подключения кошелька";
            status.classList.add('error');
        }
    };

    // Создание токена
    createBtn.onclick = async () => {
        const name = document.getElementById('name').value.trim();
        const symbol = document.getElementById('symbol').value.trim().toUpperCase();
        const supply = document.getElementById('supply').value;

        if (!name || !symbol || !supply || supply <= 0) {
            status.textContent = "Заполните все поля корректно!";
            status.classList.add('error');
            return;
        }

        status.textContent = "Создаём токен... Подтвердите транзакцию в MetaMask";
        status.classList.remove('error', 'success');
        createBtn.disabled = true;
