<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создать токен в любой сети · Комиссия 0.03 BNB</title>
  <meta name="description" content="Создай свой токен за 30 секунд в любой сети. Комиссия 0.03 BNB идёт владельцу сервиса."/>
  
  <!-- Thirdweb — поддерживает 100+ кошельков и все EVM-сети -->
  <script src="https://cdn.jsdelivr.net/npm/thirdweb@5"></script>

  <style>
    :root { --primary: #8b5cf6; --bg: #0f0f23; --card: rgba(255,255,255,0.08); }
    body { margin:0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .container { max-width:600px; width:100%; }
    .card { background:var(--card); border-radius:24px; padding:2rem; margin:1rem 0; backdrop-filter:blur(15px); border:1px solid rgba(255,255,255,0.1); text-align:center; }
    h1 { font-size:3rem; background:linear-gradient(90deg,#c084fc,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .fee { background:#1e293b; padding:1.2rem; border-radius:16px; margin:1.5rem 0; font-size:1.2rem; border:2px solid #f59e0b; }
    .fee strong { color:#fbbf24; }
    input { width:100%; padding:1rem; margin:0.7rem 0; border-radius:12px; border:none; background:rgba(255,255,255,0.1); color:white; font-size:1.1rem; }
    button { width:100%; padding:1.4rem; margin-top:1rem; background:linear-gradient(90deg,#a855f7,#3b82f6); border:none; border-radius:16px; color:white; font-size:1.4rem; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .networks { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0; }
    .net { padding:14px; background:rgba(255,255,255,0.08); border-radius:12px; cursor:pointer; transition:0.3s; font-size:0.9rem; }
    .net.active { background:var(--primary); transform:scale(1.05); }
    .success { background:rgba(34,197,94,0.2); border:1px solid #10b981; display:none; margin-top:2rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Создать свой токен</h1>
    <p>В любой сети · За 30 секунд</p>

    <!-- ТВОЯ КОМИССИЯ -->
    <div class="fee">
      Комиссия за создание: <strong>0.03 BNB</strong> (или эквивалент)<br>
      <small>100% идёт владельцу сервиса</small>
    </div>

    <div class="networks">
      <div class="net active" data-id="56">BSC</div>
      <div class="net" data-id="137">Polygon</div>
      <div class="net" data-id="1">Ethereum</div>
      <div class="net" data-id="8453">Base</div>
      <div class="net" data-id="42161">Arbitrum</div>
      <div class="net" data-id="43114">Avalanche</div>
    </div>

    <input type="text" id="name" placeholder="Название токена (My Coin)" required>
    <input type="text" id="symbol" placeholder="Символ (MYC)" maxlength="10" required>
    <input type="number" id="supply" placeholder="Общий объём (например: 1000000000)" required>

    <button id="createBtn">Оплатить 0.03 BNB и создать токен</button>

    <div id="result" class="card success">
      <h2>Токен создан!</h2>
      <p><strong>Адрес:</strong> <code id="addr"></code></p>
      <p><a id="link" target="_blank" style="color:#10b981; text-decoration:underline;">Открыть в обозревателе</a></p>
      <p style="color:#10b981; margin-top:15px;">
        Комиссия 0.03 BNB успешно отправлена владельцу сервиса
      </p>
    </div>
  </div>
</div>

<script>
  // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
  // ЗАМЕНИ НА СВОЙ КОШЕЛЁК — СЮДА БУДЕТ ПРИХОДИТЬ ВСЯ КОМИССИЯ!
  const OWNER_WALLET = "0xТВОЙ_АДРЕС_ЗДЕСЬ"; // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
  // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←

  const FEE = "0.03"; // Комиссия за создание

  let chainId = 56; // BSC по умолчанию

  document.querySelectorAll('.net').forEach(n => {
    n.onclick = () => {
      document.querySelectorAll('.net').forEach(x => x.classList.remove('active'));
      n.classList.add('active');
      chainId = parseInt(n.dataset.id);
    };
  });

  document.getElementById('createBtn').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    const symbol = document.getElementById('symbol').value.toUpperCase();
    const supply = document.getElementById('supply').value;
    const btn = document.getElementById('createBtn');

    if (!name || !symbol || !supply) return alert("Заполните все поля!");

    if (OWNER_WALLET === "0xТВОЙ_АДРЕС_ЗДЕСЬ") return alert("Вставь свой кошелёк в код!");

    btn.disabled = true;
    btn.textContent = "Подключение кошелька...";

    try {
      const wallet = await thirdweb.connect({
        clientId: "",
        chain: { chainId }
      });

      btn.textContent = "Отправка комиссии 0.03 BNB...";

      // ОТПРАВЛЯЕМ КОМИССИЮ ТЕБЕ
      await wallet.transfer({ to: OWNER_WALLET, amount: FEE });

      btn.textContent = "Создаём токен...";

      // Создаём ERC-20 токен
      const tx = await wallet.deploy("Token", [name, symbol, supply]);
      const address = tx.address;

      // Успех
      document.getElementById('addr').textContent = address;
      document.getElementById('link').href = explorer(chainId) + "/address/" + address;
      document.getElementById('result').style.display = "block";
      btn.textContent = "Готово!";

    } catch (e) {
      alert("Ошибка: " + (e.message || "Отменено пользователем"));
      btn.disabled = false;
      btn.textContent = "Оплатить 0.03 BNB и создать токен";
    }
  };

  function explorer(id) {
    const list = {
      1: "https://etherscan.io",
      56: "https://bscscan.com",
      137: "https://polygonscan.com",
      8453: "https://basescan.org",
      42161: "https://arbiscan.io",
      43114: "https://snowtrace.io"
    };
    return list[id] || "https://bscscan.com";
  }
</script>

</body>
</html>
