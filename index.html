<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Token Creator — Создай свой токен за минуту</title>

  <!-- Web3Modal + WalletConnect v2 (все кошельки) -->
  <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethereum@2.7.1/dist/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@web3modal/ui@2.7.1/dist/index.umd.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@web3modal/ui@2.7.1/dist/index.css"/>

  <!-- Ethers.js v6 -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>

  <style>
    :root {
      --bg: #0f0f1a;
      --card: rgba(30, 30, 50, 0.9);
      --accent: #00ff9d;
      --text: #ffffff;
      --gray: #aaaaaa;
    }
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 10% 20%, rgb(0, 255, 150) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgb(0, 200, 255) 0%, transparent 20%);
    }
    .container {
      width: 90%;
      max-width: 520px;
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(0,255,157,0.2);
      backdrop-filter: blur(10px);
    }
    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00ff9d, #00d0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: var(--gray);
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,255,157,0.3);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
    }
    input::placeholder { color: #777; }
    .btn {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      background: var(--accent);
      color: black;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover { background: #00cc7a; }
    .btn:disabled { background: #444; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0,0,0,0.4);
      text-align: center;
      min-height: 50px;
      font-size: 1rem;
    }
    .hidden { display: none; }
    .network-select {
      background: rgba(255,255,255,0.1);
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Token Creator</h1>
  <p class="subtitle">Создай свой ERC-20 токен в любой сети</p>

  <!-- Кнопка подключения кошелька -->
  <div id="connectSection">
    <button id="connectBtn" class="btn">Подключить кошелёк</button>
  </div>

  <!-- Форма создания токена -->
  <div id="formSection" class="hidden">
    <label>Сеть</label>
    <select id="network" class="network-select">
      <option value="ethereum">Ethereum Mainnet</option>
      <option value="polygon" selected>Polygon</option>
      <option value="bsc">Binance Smart Chain</option>
      <option value="avalanche">Avalanche</option>
      <option value="arbitrum">Arbitrum One</option>
      <option value="optimism">Optimism</option>
      <option value="base">Base</option>
      <option value="fantom">Fantom</option>
      <option value="gnosis">Gnosis Chain</option>
      <option value="zksync">zkSync Era</option>
      <option value="scroll">Scroll</option>
      <option value="linea">Linea</option>
      <option value="mantle">Mantle</option>
      <option value="celo">Celo</option>
      <option value="moonbeam">Moonbeam</option>
    </select>

    <label>Название токена</label>
    <input type="text" id="name" placeholder="My Token" required />

    <label>Символ (тикер)</label>
    <input type="text" id="symbol" placeholder="MTK" maxlength="10" required />

    <label>Decimals (обычно 18)</label>
    <input type="number" id="decimals" value="18" min="0" max="18" />

    <label>Общий supply</label>
    <input type="number" id="supply" placeholder="1000000" required />

    <button id="createBtn" class="btn">Создать токен</button>
  </div>

  <div id="status">Нажмите кнопку выше, чтобы начать</div>
</div>

<script type="module">
  import { Web3Modal } from "https://cdn.jsdelivr.net/npm/@web3modal/ethereum@2.7.1";

  // ВНИМАНИЕ: Замени на свой Project ID с https://cloud.walletconnect.com
  const projectId = "0366b8e4-9a07-4421-9372-5e0872fe4e2c"; // ← Пример! Замени на свой!

  const web3modal = new Web3Modal({
    projectId,
    walletConnectVersion: 2,
    themeMode: "dark"
  });

  let provider = null;
  let signer = null;
  let userAddress = "";

  document.getElementById("connectBtn").onclick = async () => {
    try {
      provider = await web3modal.openModal();
      const ethersProvider = new ethers.BrowserProvider(provider);
      signer = await ethersProvider.getSigner();
      userAddress = await signer.getAddress();

      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("formSection").classList.remove("hidden");
      document.getElementById("status").innerHTML = `
        Подключён: <b>\( {userAddress.slice(0,6)}... \){userAddress.slice(-4)}</b><br>
        Можно создавать токен
      `;
    } catch (err) {
      document.getElementById("status").innerHTML = "Подключение отклонено или ошибка";
      console.error(err);
    }
  };

  document.getElementById("createBtn").onclick = async () => {
    const network = document.getElementById("network").value;
    const name = document.getElementById("name").value.trim();
    const symbol = document.getElementById("symbol").value.trim().toUpperCase();
    const decimals = parseInt(document.getElementById("decimals").value);
    const supply = document.getElementById("supply").value;

    if (!name || !symbol || !supply) {
      alert("Заполните все поля!");
      return;
    }

    document.getElementById("status").innerHTML = "Создаём токен... Это может занять до 30 секунд";
    document.getElementById("createBtn").disabled = true;

    try {
      const response = await fetch("create_token.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          network,
          name,
          symbol,
          decimals,
          supply,
          owner: userAddress
        })
      });

      const result = await response.json();

      if (result.success) {
        const explorers = {
          ethereum: "https://etherscan.io",
          polygon: "https://polygonscan.com",
          bsc: "https://bscscan.com",
          avalanche: "https://snowtrace.io",
          arbitrum: "https://arbiscan.io",
          optimism: "https://optimistic.etherscan.io",
          base: "https://basescan.org",
          fantom: "https://ftmscan.com",
          gnosis: "https://gnosisscan.io",
          zksync: "https://explorer.zksync.io",
          scroll: "https://scrollscan.com",
          linea: "https://lineascan.build",
          mantle: "https://mantlescan.xyz",
          celo: "https://celoscan.io",
          moonbeam: "https://moonscan.io"
        };
        const explorer = explorers[network] || "https://etherscan.io";

        document.getElementById("status").innerHTML = `
          <div style="color:#00ff9d;font-size:1.2rem">
            Токен успешно создан!<br><br>
            <b>\( {name} ( \){symbol})</b><br><br>
            <a href="\( {explorer}/address/ \){result.contractAddress}" target="_blank" style="color:#00d0ff">
              Посмотреть контракт
            </a><br><br>
            <a href="\( {explorer}/tx/ \){result.txHash}" target="_blank" style="color:#00d0ff">
              Транзакция
            </a>
          </div>
        `;
      } else {
        document.getElementById("status").innerHTML = `<span style="color:#ff6b6b">Ошибка:</span> ${result.error || "Неизвестная ошибка"}`;
      }
    } catch (e) {
      document.getElementById("status").innerHTML = "Ошибка связи с сервером. Проверьте create_token.php";
      console.error(e);
    }

    document.getElementById("createBtn").disabled = false;
  };
</script>

</body>
</html>
