<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Creator — Создай токен в любой сети</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>

  <style>
    :root { --accent: #00ff88; --bg: #0a0a1f; --card: rgba(20,20,50,0.95); }
    body { margin:0; padding:20px; font-family: 'Segoe UI', sans-serif; background:var(--bg); color:white; min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #1a0033, #000000); }
    .container { background:var(--card); padding:40px; border-radius:24px; width:90%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:2px solid rgba(0,255,136,0.3); text-align:center; }
    h1 { font-size:2.6em; background:linear-gradient(90deg,#00ff88,#00ccff); -webkit-background-clip:text; color:transparent; margin-bottom:10px; }
    .subtitle { color:#aaa; margin-bottom:30px; }
    input, select { width:100%; padding:16px; margin:12px 0; border-radius:16px; border:none; background:#1e1e3a; color:white; font-size:16px; }
    input::placeholder { color:#777; }
    button { width:100%; padding:18px; margin:15px 0; background:var(--accent); color:black; border:none; border-radius:16px; font-size:18px; font-weight:bold; cursor:pointer; transition:0.3s; }
    button:hover:not(:disabled) { background:#00cc70; transform:scale(1.02); }
    button:disabled { background:#444; cursor:not-allowed; }
    #status { margin-top:20px; padding:18px; background:#00000088; border-radius:16px; min-height:60px; font-size:15px; line-height:1.5; }
    .hidden { display:none; }
    #qr { margin:20px auto; max-width:220px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Token Creator</h1>
  <p class="subtitle">Создай свой токен в любой сети за 30 секунд</p>

  <!-- Подключение кошелька -->
  <div id="connectSection">
    <button id="connectBtn">Подключить кошелёк</button>
  </div>

  <!-- Форма создания токена -->
  <div id="form" class="hidden">
    <select id="network">
      <option value="polygon" selected>Polygon</option>
      <option value="ethereum">Ethereum</option>
      <option value="bsc">Binance Smart Chain</option>
      <option value="arbitrum">Arbitrum</option>
      <option value="optimism">Optimism</option>
      <option value="base">Base</option>
      <option value="avalanche">Avalanche</option>
      <option value="fantom">Fantom</option>
      <option value="zksync">zkSync Era</option>
      <option value="scroll">Scroll</option>
      <option value="linea">Linea</option>
      <option value="mantle">Mantle</option>
      <option value="celo">Celo</option>
      <option value="moonbeam">Moonbeam</option>
    </select>

    <input type="text" id="name" placeholder="Название токена (например: My Token)" required>
    <input type="text" id="symbol" placeholder="Символ (MTK)" maxlength="12" required>
    <input type="number" id="decimals" value="18" min="0" max="18">
    <input type="number" id="supply" placeholder="Количество токенов (например: 1000000)" required>

    <button id="createBtn">Создать токен</button>
  </div>

  <div id="status">Нажмите кнопку выше, чтобы начать</div>
  <div id="qr" class="hidden"></div>
</div>

<script>
  let provider = null;
  let ethersProvider = null;
  let userAddress = "";

  // Публичные RPC (работают без ключей)
  const rpc = {
    ethereum: "https://eth.llamarpc.com",
    polygon: "https://polygon-rpc.com",
    bsc: "https://bsc-dataseed.binance.org",
    arbitrum: "https://arb1.arbitrum.io/rpc",
    optimism: "https://mainnet.optimism.io",
    base: "https://mainnet.base.org",
    avalanche: "https://api.avax.network/ext/bc/C/rpc",
    fantom: "https://rpc.ftm.tools",
    zksync: "https://mainnet.era.zksync.io",
    scroll: "https://rpc.scroll.io",
    linea: "https://rpc.linea.build",
    mantle: "https://rpc.mantle.xyz",
    celo: "https://forno.celo.org",
    moonbeam: "https://rpc.api.moonbeam.network"
  };

  // Подключение кошелька
  document.getElementById("connectBtn").onclick = async () => {
    try {
      document.getElementById("status").innerHTML = "Подключение...";

      // 1. MetaMask / любой injected кошелёк
      if (window.ethereum) {
        provider = window.ethereum;
        await provider.request({ method: "eth_requestAccounts" });
      } 
      // 2. WalletConnect (QR-код для мобильных)
      else {
        const wc = new WalletConnectProvider({ rpc, qrcode: true });
        await wc.enable();
        provider = wc;
        document.getElementById("qr").innerHTML = "<p>Отсканируйте QR-код в мобильном кошельке</p>";
        document.getElementById("qr").classList.remove("hidden");
      }

      ethersProvider = new ethers.providers.Web3Provider(provider);
      const signer = ethersProvider.getSigner();
      userAddress = await signer.getAddress();

      document.getElementById("connectSection").classList.add("hidden");
      document.getElementById("form").classList.remove("hidden");
      document.getElementById("status").innerHTML = `
        Подключён: <b>\( {userAddress.slice(0,6)}... \){userAddress.slice(-4)}</b><br>
        Теперь можно создать токен
      `;
    } catch (e) {
      document.getElementById("status").innerHTML = "Ошибка подключения. Установите MetaMask или используйте мобильный кошелёк.";
      console.error(e);
    }
  };

  // Создание токена
  document.getElementById("createBtn").onclick = async () => {
    const network = document.getElementById("network").value;
    const payload = {
      network,
      name: document.getElementById("name").value.trim(),
      symbol: document.getElementById("symbol").value.trim().toUpperCase(),
      decimals: parseInt(document.getElementById("decimals").value) || 18,
      supply: document.getElementById("supply").value,
      owner: userAddress
    };

    if (!payload.name || !payload.symbol || !payload.supply) {
      alert("Заполните все поля!");
      return;
    }

    document.getElementById("status").innerHTML = "Создаём токен... Это займёт 10–30 секунд";
    document.getElementById("createBtn").disabled = true;

    try {
      const res = await fetch("create_token.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      const explorers = {
        ethereum: "https://etherscan.io",
        polygon: "https://polygonscan.com",
        bsc: "https://bscscan.com",
        arbitrum: "https://arbiscan.io",
        optimism: "https://optimistic.etherscan.io",
        base: "https://basescan.org",
        avalanche: "https://snowtrace.io",
        fantom: "https://ftmscan.com",
        zksync: "https://explorer.zksync.io",
        scroll: "https://scrollscan.com",
        linea: "https://lineascan.build",
        mantle: "https://mantlescan.xyz",
        celo: "https://celoscan.io",
        moonbeam: "https://moonscan.io"
      };

      if (data.success) {
        document.getElementById("status").innerHTML = `
          <div style="color:#00ff88;font-size:18px">
            ТОКЕН СОЗДАН!<br><br>
            <b>\( {payload.name} ( \){payload.symbol})</b><br><br>
            <a href="\( {explorers[network] || "https://polygonscan.com"}/address/ \){data.contractAddress}" 
               target="_blank" style="color:#00ccff; text-decoration:underline;">
              Посмотреть контракт
            </a>
            \( {data.txHash ? `<br><br><a href=" \){explorers[network] || "https://polygonscan.com"}/tx/${data.txHash}" target="_blank" style="color:#00ccff;">
              Транзакция
            </a>` : ""}
          </div>
        `;
      } else {
        document.getElementById("status").innerHTML = `<span style="color:#ff6b6b">Ошибка:</span> ${data.error || "Неизвестная ошибка"}`;
      }
    } catch (e) {
      document.getElementById("status").innerHTML = "Сервер недоступен. Проверьте create_token.php";
    }

    document.getElementById("createBtn").disabled = false;
  };
</script>

</body>
</html>
