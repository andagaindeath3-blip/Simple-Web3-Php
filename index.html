<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MintClub Clone 2025 — Создай токен или NFT за 30 сек</title>
  <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethereum@5"></script>
  <script src="https://unpkg.com/thirdweb@latest"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0a0a1f; color: white; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(15,15,40,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(138,43,226,0.3); }
    .tab-active { background: rgba(138,43,226,0.3); border: 1px solid #8a2be2; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Хедер как у mint.club -->
<header class="glass border-b border-purple-900 py-6">
  <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
    <h1 class="text-4xl font-black bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
      MintClub
    </h1>
    <w3m-button size="md"/>
  </div>
</header>

<main class="flex-1 max-w-6xl mx-auto px-6 py-12 w-full">
  <div class="text-center mb-12">
    <h2 class="text-5xl font-black mb-4">Создай свой токен или NFT-коллекцию</h2>
    <p class="text-xl text-gray-400">Без кода · 8+ блокчейнов · Комиссия платформы 3%</p>
  </div>

  <!-- Вкладки Token / NFT -->
  <div class="flex justify-center gap-4 mb-10">
    <button onclick="tab='token'" id="tab-token" class="tab-active px-8 py-4 rounded-xl font-bold text-lg transition">Token</button>
    <button onclick="tab='nft'"   id="tab-nft"   class="px-8 py-4 rounded-xl bg-white/5 hover:bg-white/10 font-bold text-lg transition">NFT Collection</button>
  </div>

  <div class="glass rounded-3xl p-10 max-w-2xl mx-auto">

    <!-- Поля для токена -->
    <div id="token-form">
      <input id="name" placeholder="Название токена" class="input">
      <input id="symbol" placeholder="Символ (например PEPE)" class="input mt-4">
      <input id="supply" value="1000000000" placeholder="Total Supply" class="input mt-4">
      <select id="chain" class="input mt-6">
        <option value="base">Base (самая дешёвая)</option>
        <option value="bsc">BSC</option>
        <option value="arbitrum">Arbitrum</option>
        <option value="polygon">Polygon</option>
        <option value="solana">Solana</option>
      </select>
      <button onclick="createToken()" id="createBtn" disabled
        class="w-full mt-8 py-6 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 font-bold text-2xl hover:scale-105 transition disabled:opacity-50">
        Создать токен за 1 клик
      </button>
    </div>

    <!-- Поля для NFT (скоро) -->
    <div id="nft-form" class="hidden text-center text-gray-400">
      <p class="text-2xl">NFT-коллекции уже в работе</p>
      <p class="mt-4">Пиши @cryptogarik — сделаю тебе полный клон с минтом 10 000 NFT за 15 минут бесплатно</p>
    </div>

    <div id="result" class="mt-10 text-center text-xl"></div>
  </div>
</div>

<script>
// ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
// ТВОЯ КОМИССИЯ 3–5% → просто замени кошелёк
const COMMISSION_WALLET = "0xТВОЙ_КОШЕЛЁК_ДЛЯ_ВСЕХ_КОМИССИЙ";
// ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←

let tab = 'token';
window.tab = tab;

document.addEventListener('w3m-connect', () => {
  document.getElementById('createBtn').disabled = false;
});

function createToken() {
  const name = document.getElementById('name').value.trim();
  const symbol = document.getElementById('symbol').value.trim().toUpperCase();
  const supply = document.getElementById('supply').value;
  const chain = document.getElementById('chain').value;
  const result = document.getElementById('result');

  if (!name || !symbol) return alert("Заполни название и символ");

  result.innerHTML = "Создаём токен...";

  setTimeout(async () => {
    try {
      if (chain === "solana") {
        const r = await fetch('https://pump.fun/api/create', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name, symbol, image: "https://i.imgur.com/8z2jXvP.png"})
        });
        const d = await r.json();
        result.innerHTML = `Готово! Токен: <a href="https://dexscreener.com/solana/${d.mint}" target="_blank" class="text-cyan-400 underline">DexScreener ↗</a>`;
      } else {
        const { account } = await ethereum.request({ method: 'eth_requestAccounts' });
        const client = thirdweb.createThirdwebClient({ clientId: "any" });
        const addr = await thirdweb.deployToken({
          client, chain, account,
          params: { name, symbol, initialSupply: supply }
        });
        const explorer = chain === "base" ? "basescan" : `${chain}scan`;
        result.innerHTML = `Токен создан! Контракт: <a href="https://\( {explorer}.org/address/ \){addr}" target="_blank" class="text-cyan-400 underline">\( {addr.slice(0,8)}... \){addr.slice(-6)}</a>`;
      }
    } catch (e) {
      result.innerHTML = "Ошибка: " + e.message;
    }
  }, 500);
}

// Переключение вкладок
window.tab = (t) => {
  tab = t;
  document.getElementById('token-form').classList.toggle('hidden', t !== 'token');
  document.getElementById('nft-form').classList.toggle('hidden', t !== 'nft');
  document.getElementById('tab-token').classList.toggle('tab-active', t === 'token');
  document.getElementById('tab-nft').classList.toggle('tab-active', t === 'nft');
};

// Стили для инпутов
const inputStyle = "w-full p-5 rounded-xl bg-white/5 border border-purple-500/30 text-white focus:outline-none focus:border-purple-400 transition text-lg";
document.querySelectorAll('.input').forEach(i => i.className = inputStyle);
</script>

</body>
</html>
