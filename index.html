<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERC-20 Creator — Создать токен за $5</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --primary: #00d4ff;
            --accent: #ff0080;
            --text: #ffffff;
            --border: #333355;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; 
               background-image: radial-gradient(circle at 10% 20%, rgba(0,212,255,0.1) 0%, transparent 20%),
                                 radial-gradient(circle at 90% 80%, rgba(255,0,128,0.1) 0%, transparent 20%);
               display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { text-align: center; max-width: 600px; width: 100%; }
        h1 { font-size: 3.5rem; margin-bottom: 20px; background: linear-gradient(45deg, #00d4ff, #ff0080);
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        p { font-size: 1.4rem; margin-bottom: 40px; opacity: 0.9; }

        .form-card {
            background: var(--card); padding: 40px; border-radius: 32px; 
            border: 1px solid var(--border); box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .input-group { margin-bottom: 24px; text-align: left; }
        label { display: block; margin-bottom: 10px; font-weight: 600; opacity: 0.9; }
        input, select, textarea {
            width: 100%; padding: 16px; background: #16213e; border: none; 
            border-radius: 20px; color: white; font-size: 1.1rem;
        }
        textarea { height: 100px; resize: none; }

        .fee-info {
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(255,0,128,0.2));
            padding: 20px; border-radius: 20px; margin: 30px 0; font-weight: 600;
            border: 1px solid rgba(0,212,255,0.3);
        }

        .connect-btn, .create-btn {
            width: 100%; padding: 18px; border: none; border-radius: 24px;
            font-size: 1.5rem; font-weight: 800; cursor: pointer; margin: 12px 0;
            transition: all 0.3s;
        }
        .connect-btn { background: linear-gradient(45deg, #00d4ff, #0099cc); }
        .create-btn { background: linear-gradient(45deg, #ff0080, #ff6b00); opacity: 0.6; }
        .create-btn:not(:disabled) { opacity: 1; }
        .create-btn:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(255,0,128,0.4); }

        #status { margin-top: 20px; padding: 15px; background: rgba(0,255,0,0.2); border-radius: 16px; display: none; }
        .error { background: rgba(255,0,0,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h1>Создать ERC-20 токен за $5</h1>
    <p>Поддержка Ethereum, Polygon, BSC, Arbitrum, Base, Optimism, Avalanche</p>
    <p style="font-size:1.8rem;color:#00ff88;margin:20px 0;">Ты получаешь 100% комиссии автоматически!</p>

    <div class="form-card">
        <div class="input-group">
            <label>Сеть</label>
            <select id="network">
                <option value="1">Ethereum Mainnet</option>
                <option value="137">Polygon</option>
                <option value="56">BNB Smart Chain</option>
                <option value="42161">Arbitrum One</option>
                <option value="10">Optimism</option>
                <option value="8453">Base</option>
                <option value="43114">Avalanche C-Chain</option>
            </select>
        </div>

        <div class="input-group">
            <label>Название токена</label>
            <input type="text" id="name" placeholder="My Awesome Token">
        </div>

        <div class="input-group">
            <label>Тикер (Symbol)</label>
            <input type="text" id="symbol" placeholder="MAT" maxlength="10">
        </div>

        <div class="input-group">
            <label>Общее количество (с decimals)</label>
            <input type="number" id="supply" value="1000000000000000000000000">
        </div>

        <div class="fee-info">
            Стоимость создания: <b style="color:#00ff88;">$5</b><br>
            Ты получаешь: <b>100%</b> комиссии на свой кошелёк
        </div>

        <button id="connectBtn" class="connect-btn">Подключить любой кошелёк</button>
        <button id="createBtn" class="create-btn" disabled>Создать токен за $5</button>

        <div id="status"></div>
    </div>
</div>

<script>
// ТВОЙ КОШЕЛЁК — СЮДА ПРИХОДЯТ ВСЕ $5!
const MY_WALLET = "0xТВОЙ_АДРЕС_ЗДЕСЬ"; // ← Замени на свой ETH-адрес

let provider, signer, account;

document.getElementById('connectBtn').onclick = async () => {
    if (!window.ethereum) {
        alert("Установите MetaMask, Trust Wallet, Coinbase Wallet или другой кошелёк!");
        return;
    }

    try {
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        account = await signer.getAddress();

        document.getElementById('connectBtn').innerHTML = `Подключено: \( {account.slice(0,6)}... \){account.slice(-4)}`;
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('createBtn').disabled = false;
    } catch (err) {
        alert("Подключение отменено");
        console.error(err);
    }
};

    if (!account) return alert("Сначала подключи кошелёк!");

    const name = document.getElementById('name').value.trim();
    const symbol = document.getElementById('symbol').value.trim().toUpperCase();
    const supply = document.getElementById('supply').value;
    const chainId = document.getElementById('network').value;

    btn.disabled = true;
    btn.textContent = "Создаём токен...";

    status.className = "";
    status.textContent = "Отправляем $5 тебе...";

        // 1. Отправляем $5 тебе
